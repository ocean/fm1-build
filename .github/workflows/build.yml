# fm1-build: ONE shared, reusable workflow that builds an M-VAVE FM-1 / SMK-37 firmware from its own repository and
# signs a build attestation for the packages. The Firmware Hub (thefirmwarehub.com) shows "Built from source" only for
# packages attested by this workflow, at a reviewed tag of it. It is kept short on purpose, so anyone can review it.
#
# What it does, and nothing else, in three jobs, each with only the permissions it needs:
#   build    (read only)       1. checks out the calling repository at the commit of the run (the firmware's source)
#                              2. installs Python + Pillow (pinned, hash-checked) and JieLi's Linux toolchain (its
#                                 SHA-256 checked), and optionally Zig (pinned) and the JieLi AC79 SDK (its commit
#                                 checked)
#                              3. runs the repository's own build command (inputs.build) and, if given, its tests
#                                 (inputs.test), then lists the packages (inputs.packages) in SHA256SUMS
#   attest   (sign only)       4. attests exactly the packages in SHA256SUMS with actions/attest-build-provenance
#   release  (tags; write)     5. checks the packages against SHA256SUMS and publishes them as the release of that tag
# The build command is the repository's: what it does is in that commit, for anyone to read. It runs where it cannot
# sign anything or write to the repository: only the attest job can sign, and only the release job can write, and
# neither runs any of the repository's code or anything downloaded.
#
# Use it from a firmware repository (.github/workflows/release.yml):
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     build:
#       uses: zvenson/fm1-build/.github/workflows/build.yml@v1
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#       with:
#         build: ./build.sh --release "${GITHUB_REF_NAME#v}"
#         packages: build/*.fwsc
name: fm1-build

on:
  workflow_call:
    inputs:
      build:
        description: "the repository's build command (run in its root, bash)"
        required: true
        type: string
      packages:
        description: "the packages to attest and release (one or more globs, e.g. build/*.fwsc, or build/dist/*)"
        required: true
        type: string
      test:
        description: "the repository's test command (optional)"
        required: false
        type: string
        default: ""
      tests-block:
        description: "whether a failing test stops the release"
        required: false
        type: boolean
        default: true
      sdk:
        description: "clone the JieLi AC79 SDK (AC79NN_SDK_V1.2.1_2023-12-13) to ~/fw-AC79_AIoT_SDK"
        required: false
        type: boolean
        default: true
      zig:
        description: "install Zig 0.17.0 ($ZIG, and on the PATH): zig cc for a WebAssembly build of the firmware"
        required: false
        type: boolean
        default: false

permissions: {}

# Every action is pinned to a commit, its version in the comment: each runs on Node 24 (GitHub is retiring Node 20).
# Everything downloaded is pinned and checked before it is used. To update one, check the new file (a signature or a
# provenance where its maker publishes one), then change the pin here, in a new tag of this workflow.
#   JIELI_URL: where pkgman.jieliapp.com/s/linux-toolchain leads today
#   PILLOW: the wheel for Python 3.12 on x86_64 Linux. 13.0.0: nine advisories against 12.3.0 (one critical,
#           GHSA-8g5g-8vmr-9782), fixed only here; published by python-pillow/Pillow's wheels.yml (PyPI trusted publishing)
#   ZIG_URL: minisign-signed by Zig's maintainers (ziglang.org/download)
env:
  JIELI_URL: https://jl-update.oss-cn-shenzhen.aliyuncs.com/jieli-linux-toolchains-20260730.1.tar.xz
  JIELI_SHA256: a1545cddbc451a06bac43eb5cd96d831470c42a97c5c0b1f98879a20fc7647bd
  SDK_TAG: AC79NN_SDK_V1.2.1_2023-12-13
  SDK_COMMIT: d179b4484759423312073f5fbb232501aa491047
  PILLOW: pillow==13.0.0 --hash=sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca
  ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
  ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read           # the checkout, and nothing else: the build cannot sign or write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
        with:
          python-version: '3.12'

      - name: Python packages (pinned, hash-checked)
        run: |
          echo "$PILLOW" > "$RUNNER_TEMP/requirements.txt"
          python3 -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/requirements.txt"

      - name: JieLi Linux toolchain (its SHA-256 checked)
        run: |
          mkdir -p ~/.jieli
          curl --proto '=https' -fL --retry 3 -o "$RUNNER_TEMP/jieli.tar.xz" "$JIELI_URL"
          echo "$JIELI_SHA256  $RUNNER_TEMP/jieli.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/jieli.tar.xz" -C ~/.jieli
          TC="$(ls -d ~/.jieli/jieli-linux-toolchains-* | sort | tail -1)"
          ln -sfn "$(basename "$TC")" ~/.jieli/toolchain
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
          echo "toolchain: $(basename "$TC")"

      - name: JieLi AC79 SDK (gitee.com, a fixed tag, its commit checked)
        if: inputs.sdk
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch "$SDK_TAG" \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test "$(git -C ~/fw-AC79_AIoT_SDK rev-parse HEAD)" = "$SDK_COMMIT" \
              || { echo "the SDK's tag $SDK_TAG is not at $SDK_COMMIT"; exit 1; }
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> "$GITHUB_ENV"

      - name: Zig (optional, its SHA-256 checked)
        if: inputs.zig
        run: |
          curl --proto '=https' -fL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "$ZIG_URL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p ~/.zig && tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C ~/.zig --strip-components 1
          echo "ZIG=$HOME/.zig/zig" >> "$GITHUB_ENV"
          echo "$HOME/.zig" >> "$GITHUB_PATH"

      - name: Build (the repository's own command)
        shell: bash
        env:
          BUILD: ${{ inputs.build }}
        run: eval "$BUILD"

      - name: Tests (the repository's own command)
        if: inputs.test != ''
        continue-on-error: ${{ !inputs.tests-block }}
        shell: bash
        env:
          TEST: ${{ inputs.test }}
        run: eval "$TEST"

      - name: The packages and their SHA-256
        shell: bash
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          shopt -s nullglob
          files=($PACKAGES)
          [ ${#files[@]} -gt 0 ] || { echo "no package matches: $PACKAGES"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          for f in "${files[@]}"; do
            n=$(basename "$f")
            [ ! -e "$RUNNER_TEMP/release/$n" ] || { echo "two packages are called $n"; exit 1; }
            cp "$f" "$RUNNER_TEMP/release/"
          done
          (cd "$RUNNER_TEMP/release" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/release/"
          cat "$RUNNER_TEMP/release/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: packages
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write          # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: packages
          path: release

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8   # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

  release:
    needs: attest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write          # the release of this tag
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
        with:
          name: packages
          path: release

      - name: Release (the attested packages, checked again)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" -- *
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes -- *
          fi
